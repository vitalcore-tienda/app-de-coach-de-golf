<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GolfCoach · accesibilidad</title>
  <link rel="stylesheet" href="../css/style.css?test=v25">
  <link rel="stylesheet" href="../css/components.css?test=v25">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <pre id="result" style="position:fixed;z-index:4000;top:0;left:0;max-width:100%;max-height:9rem;overflow:auto;background:#fff;color:#111;font:12px monospace;">Ejecutando…</pre>

  <div class="app-container">
    <aside class="sidebar">
      <button class="nav-item active" type="button" data-view="dashboard" aria-current="page">Inicio</button>
      <button class="nav-item" type="button" data-view="players">Golfistas</button>
    </aside>
    <header class="topbar">
      <h1 id="current-page-title">Dashboard 360°</h1>
      <button class="mobile-topbar-actions-btn" id="mobile-topbar-actions-btn" type="button" aria-expanded="false">Acciones</button>
      <div id="topbar-actions"></div>
      <button class="demo-mode-indicator" type="button">Modo demo</button>
    </header>
    <main class="main-content" id="main-content" tabindex="-1" style="padding-top:11rem;">
      <span class="sr-only" id="route-announcer" role="status" aria-live="polite" aria-atomic="true"></span>
      <section class="view-panel active" id="dashboard-panel" aria-hidden="false">Inicio</section>
      <section class="view-panel" id="players-panel" aria-hidden="true">Golfistas</section>
      <button class="btn btn-primary btn-sm" id="modal-trigger" type="button">Abrir ventana</button>
      <button class="filter-pill" type="button">Filtro</button>
      <button class="btn-icon" type="button" aria-label="Acción de prueba">A</button>
      <button class="btn btn-secondary btn-sm pwa-install-button" type="button">Instalar</button>
      <button id="mobile-more-btn" type="button" aria-controls="mobile-drawer-overlay" aria-expanded="false">Más</button>
      <button id="mobile-drawer-toggle-btn" type="button" aria-controls="mobile-drawer-overlay" aria-expanded="false">Menú</button>
    </main>
  </div>

  <div class="mobile-drawer-overlay" id="mobile-drawer-overlay" aria-hidden="true">
    <div class="mobile-drawer-content" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <h2 id="drawer-title">Más secciones</h2>
      <button class="modal-close" type="button" aria-label="Cerrar menú">×</button>
      <button type="button">Primera sección</button>
      <button type="button" id="drawer-last">Última sección</button>
    </div>
  </div>

  <div class="modal-overlay" id="global-modal" aria-hidden="true">
    <div class="modal-box" id="global-modal-content" role="dialog" aria-modal="true" aria-label="Ventana de GolfCoach" tabindex="-1">
      <h2>Editar información</h2>
      <button class="modal-close" type="button">×</button>
      <label for="accessible-field">Nombre</label>
      <input id="accessible-field" class="form-control" type="text">
      <button type="button" id="modal-last">Guardar</button>
    </div>
  </div>
  <div id="toast-container"></div>

  <script>
    window.STORAGE_KEYS = { THEME: 'theme' };
    window.StorageManager = {
      initialize: async () => {}, get: (_key, fallback) => fallback,
      isWorkspaceUnlocked: () => true, getActivePlayerId: () => 'player-test',
      isDemoPlayer: () => false, getProfile: () => ({ name: 'Golfista de prueba' })
    };
    window.AuthEngine = { isCoach: () => true, openAccessModal() {} };
  </script>
  <script src="../js/utils.js?test=v25"></script>
  <script src="../js/app.js?test=v25"></script>
  <script>
    App.init = async () => { App.ready = true; };

    window.addEventListener('load', async () => {
      const result = document.getElementById('result');
      const checks = [];
      const waitFrame = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const assert = (condition, label) => {
        checks.push({ label, passed: Boolean(condition) });
        if (!condition) throw new Error(label);
      };
      const parseColor = (value) => {
        const match = String(value).trim().match(/^#([\da-f]{6})$/i);
        if (!match) throw new Error(`Color no compatible: ${value}`);
        return match[1].match(/../g).map((pair) => Number.parseInt(pair, 16));
      };
      const luminance = (color) => {
        const channels = parseColor(color).map((channel) => {
          const normalized = channel / 255;
          return normalized <= 0.04045 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
        });
        return (0.2126 * channels[0]) + (0.7152 * channels[1]) + (0.0722 * channels[2]);
      };
      const contrast = (foreground, background) => {
        const first = luminance(foreground);
        const second = luminance(background);
        return (Math.max(first, second) + 0.05) / (Math.min(first, second) + 0.05);
      };
      const cssToken = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      try {
        assert(document.querySelector('meta[name="viewport"]').content.includes('initial-scale=1'), 'La prueba conserva una escala inicial legible');
        assert(typeof GolfA11y.announce === 'function' && typeof GolfA11y.trapFocus === 'function', 'La app comparte ayudas para anuncios y control del foco');

        const skipLink = document.querySelector('.skip-link');
        skipLink.focus();
        assert(skipLink.getBoundingClientRect().top >= 0, 'El acceso para saltar al contenido aparece al recibir foco');
        skipLink.click();
        await waitFrame();
        assert(document.activeElement === document.getElementById('main-content'), 'Saltar al contenido mueve el foco al área principal');

        const originalMatchMedia = window.matchMedia;
        window.matchMedia = () => ({ matches: true, addEventListener() {}, removeEventListener() {} });
        assert(GolfA11y.prefersReducedMotion(), 'La app detecta la preferencia de movimiento reducido');
        assert(GolfA11y.scrollBehavior() === 'auto', 'El desplazamiento animado se desactiva con movimiento reducido');
        window.matchMedia = originalMatchMedia;

        for (const theme of ['dark', 'light']) {
          document.documentElement.dataset.theme = theme;
          const surface = cssToken('--bg-surface-elevated');
          for (const token of ['--text-main', '--text-muted', '--text-subtle', '--text-gold', '--primary-300']) {
            assert(contrast(cssToken(token), surface) >= 4.5, `${token} mantiene contraste AA en tema ${theme}`);
          }
        }
        document.documentElement.dataset.theme = 'dark';

        const targets = ['.btn-sm', '.filter-pill', '.btn-icon', '.demo-mode-indicator', '.pwa-install-button'];
        targets.forEach((selector) => {
          const element = document.querySelector(selector);
          const rect = element.getBoundingClientRect();
          assert(rect.height >= 44 && rect.width >= 44, `${selector} ofrece un área táctil mínima de 44 × 44 px`);
        });

        App.navigateTo('players');
        await waitFrame();
        assert(document.querySelector('[data-view="players"]').getAttribute('aria-current') === 'page', 'La navegación informa cuál sección está activa');
        assert(document.getElementById('players-panel').getAttribute('aria-hidden') === 'false', 'La vista activa queda disponible para lectores de pantalla');
        assert(document.getElementById('dashboard-panel').getAttribute('aria-hidden') === 'true', 'Las vistas inactivas se ocultan a lectores de pantalla');
        assert(document.getElementById('route-announcer').textContent === 'Sección Golfistas', 'El cambio de sección se anuncia sin mover el foco');

        const modalTrigger = document.getElementById('modal-trigger');
        modalTrigger.focus();
        App.openModal();
        await waitFrame();
        const modal = document.getElementById('global-modal');
        const modalContent = document.getElementById('global-modal-content');
        assert(modal.getAttribute('aria-hidden') === 'false' && modalContent.getAttribute('aria-modal') === 'true', 'La ventana abierta expone semántica de diálogo modal');
        assert(Boolean(modalContent.getAttribute('aria-labelledby')), 'La ventana usa su título como nombre accesible');
        assert(document.querySelector('.app-container').inert, 'El contenido de fondo se bloquea mientras la ventana está abierta');
        assert(document.activeElement === modalContent, 'El foco entra en la ventana al abrirla');
        const modalCloseRect = modalContent.querySelector('.modal-close').getBoundingClientRect();
        assert(modalCloseRect.width >= 44 && modalCloseRect.height >= 44, 'El cierre de la ventana ofrece un área táctil de 44 × 44 px');

        const modalFocusable = GolfA11y.focusable(modalContent);
        modalFocusable.at(-1).focus();
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        assert(document.activeElement === modalFocusable[0], 'Tab vuelve al primer control al final de la ventana');
        modalFocusable[0].focus();
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, bubbles: true, cancelable: true }));
        assert(document.activeElement === modalFocusable.at(-1), 'Mayús + Tab vuelve al último control al comienzo de la ventana');
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        assert(modal.getAttribute('aria-hidden') === 'true' && !document.querySelector('.app-container').inert, 'Escape cierra la ventana y libera el contenido');
        assert(document.activeElement === modalTrigger, 'Al cerrar la ventana el foco regresa al control que la abrió');

        const drawerTrigger = document.getElementById('mobile-more-btn');
        drawerTrigger.focus();
        App.toggleMobileDrawer();
        await waitFrame();
        const drawer = document.getElementById('mobile-drawer-overlay');
        assert(drawer.getAttribute('aria-hidden') === 'false' && drawerTrigger.getAttribute('aria-expanded') === 'true', 'El menú celular comunica su estado abierto');
        assert(document.activeElement === drawer.querySelector('.modal-close'), 'El foco entra en el menú celular');
        document.getElementById('drawer-last').focus();
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        assert(document.activeElement === drawer.querySelector('.modal-close'), 'El foco queda contenido dentro del menú celular');
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        assert(drawer.getAttribute('aria-hidden') === 'true' && document.activeElement === drawerTrigger, 'Escape cierra el menú y devuelve el foco');

        const label = document.querySelector('label[for="accessible-field"]');
        assert(label && document.getElementById(label.htmlFor), 'Los campos relacionan visualmente y semánticamente sus etiquetas');

        result.dataset.status = 'passed';
        result.textContent = JSON.stringify({ passed: true, checks }, null, 2);
      } catch (error) {
        result.dataset.status = 'failed';
        result.textContent = JSON.stringify({ passed: false, checks, error: error.message }, null, 2);
      }
    });
  </script>
</body>
</html>
