<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GolfCoach · navegación por rol</title>
  <link rel="stylesheet" href="../css/style.css?test=v24">
  <link rel="stylesheet" href="../css/components.css?test=v24">
  <style>#result { max-width: 100%; max-height: 8rem; overflow: auto; }</style>
</head>
<body class="player-portal-active">
  <header class="topbar"><h1 class="page-title" id="current-page-title">Hoy</h1></header>
  <main class="main-content">
    <h1>Prueba de navegación por rol</h1>
    <pre id="result">Ejecutando…</pre>
    <section class="view-panel active" id="player-portal-panel">
      <div id="player-portal-container">
        <section id="player-portal-today">Hoy</section>
        <section id="player-portal-plan">Mi plan</section>
        <section id="player-portal-progress">Progreso</section>
        <section id="player-portal-messages-card">Mensajes</section>
      </div>
    </section>
    <section class="view-panel" id="messages-panel"><div id="messages-container"></div></section>
  </main>

  <nav class="bottom-nav-bar coach-bottom-nav" id="mobile-bottom-nav" aria-label="Navegación del entrenador">
    <button class="bottom-nav-item active" type="button" data-view="dashboard"><span class="bottom-nav-icon">🏠</span><span class="bottom-nav-label">Inicio</span></button>
    <button class="bottom-nav-item" type="button" data-view="players"><span class="bottom-nav-icon">👥</span><span class="bottom-nav-label">Golfistas</span></button>
    <button class="bottom-nav-item" type="button" data-view="drills"><span class="bottom-nav-icon">🎯</span><span class="bottom-nav-label">Planes</span></button>
    <button class="bottom-nav-item" type="button" data-view="messages"><span class="bottom-nav-icon">💬</span><span class="bottom-nav-label">Mensajes</span></button>
    <button class="bottom-nav-item" type="button"><span class="bottom-nav-icon">☰</span><span class="bottom-nav-label">Más</span></button>
  </nav>

  <nav class="bottom-nav-bar player-bottom-nav" id="player-bottom-nav" aria-label="Navegación del golfista" hidden>
    <button class="bottom-nav-item active" type="button" data-player-section="today" aria-current="page"><span class="bottom-nav-icon">☀️</span><span class="bottom-nav-label">Hoy</span></button>
    <button class="bottom-nav-item" type="button" data-player-section="plan"><span class="bottom-nav-icon">🎯</span><span class="bottom-nav-label">Mi plan</span></button>
    <button class="bottom-nav-item" type="button" data-player-section="progress"><span class="bottom-nav-icon">📈</span><span class="bottom-nav-label">Progreso</span></button>
    <button class="bottom-nav-item" type="button" data-player-section="messages"><span class="bottom-nav-icon">💬</span><span class="bottom-nav-label">Mensajes</span></button>
  </nav>

  <div id="global-modal"><div id="global-modal-content"></div></div>

  <script>
    window.AuthEngine = {
      user: { id: 'role-navigation-user' },
      profile: { account_role: 'player' },
      isCoach() { return this.profile?.account_role === 'coach'; },
      isNetworkError() { return false; },
      renderModal() {}
    };
    window.App = { showToast() {}, closeModal() {}, navigateTo() {} };
    window.StorageManager = {
      async getPlayers() {
        return [
          { id: 'local-player-real', name: 'Golfista Vinculado', remoteId: '11111111-1111-4111-8111-111111111111' },
          { id: 'local-player-demo', name: 'Golfista Demo', isDemo: true }
        ];
      },
      isDemoPlayer(player) { return player?.isDemo === true; }
    };
  </script>
  <script src="../js/icons.js?test=v24"></script>
  <script src="../js/utils.js?test=v24"></script>
  <script src="../js/player-portal.js?test=v24"></script>
  <script>
    (async () => {
      const result = document.getElementById('result');
      const checks = [];
      const assert = (condition, label) => {
        checks.push({ label, passed: Boolean(condition) });
        if (!condition) throw new Error(label);
      };

      try {
        const coachLabels = [...document.querySelectorAll('#mobile-bottom-nav .bottom-nav-label')].map((item) => item.textContent.trim());
        const playerLabels = [...document.querySelectorAll('#player-bottom-nav .bottom-nav-label')].map((item) => item.textContent.trim());
        assert(coachLabels.join(' · ') === 'Inicio · Golfistas · Planes · Mensajes · Más', 'El entrenador tiene las cinco secciones prioritarias');
        assert(Boolean(document.querySelector('#mobile-bottom-nav [data-view="players"]')), 'Golfistas está visible fuera del menú Más');
        assert(playerLabels.join(' · ') === 'Hoy · Mi plan · Progreso · Mensajes', 'El golfista tiene una navegación enfocada en su experiencia');
        await new Promise((resolve) => setTimeout(resolve, 30));
        assert(document.querySelectorAll('#mobile-bottom-nav svg.ui-icon').length === 5, 'La navegación del entrenador usa cinco iconos SVG');
        assert(document.querySelectorAll('#player-bottom-nav svg.ui-icon').length === 4, 'La navegación del golfista usa cuatro iconos SVG');

        PlayerPortal.active = true;
        PlayerPortal.data = {
          player: { full_name: 'Golfista de Prueba', current_handicap: 14.2, target_handicap: 11, player_category: 'Amateur' },
          handicapHistory: [],
          trainingAssignments: [{ id: '22222222-2222-4222-8222-222222222222', title: 'Control de distancia', category: 'putting', status: 'assigned', due_date: '2026-09-10' }],
          tournaments: [],
          rounds: [],
          goals: [],
          legacyDrillProgress: {},
          messages: [{ id: 'message-user-content', sender_user_id: 'role-navigation-user', sender_role: 'player', body: 'Hoy me sentí muy bien ⛳', created_at: new Date().toISOString() }],
          fetchedAt: new Date().toISOString()
        };
        PlayerPortal.render();
        await new Promise((resolve) => setTimeout(resolve, 30));
        assert(!document.getElementById('player-bottom-nav').hidden, 'La barra del golfista aparece al cargar una ficha vinculada');
        assert(document.querySelectorAll('#player-portal-container svg.ui-icon').length >= 6, 'La interfaz dinámica usa iconos SVG consistentes');
        const interfaceKeepsEmoji = [...document.querySelectorAll(GolfIcons.targetSelector)]
          .some((element) => GolfIcons.emojiPattern().test(element.textContent || ''));
        assert(!interfaceKeepsEmoji, 'Los controles de interfaz ya no muestran emojis del sistema operativo');
        assert(document.querySelector('.portal-message-body').textContent.includes('⛳'), 'Los emojis escritos por el usuario se conservan como contenido personal');
        assert(!document.querySelector('.portal-message-body svg'), 'El sistema no transforma el contenido personal en iconos de interfaz');
        assert(PlayerPortal.navigateToSection('messages'), 'Mensajes navega a la sección privada del golfista');
        assert(document.querySelector('[data-player-section="messages"]').getAttribute('aria-current') === 'page', 'La sección activa se comunica a lectores de pantalla');
        assert(document.getElementById('current-page-title').textContent === 'Mensajes', 'La cabecera acompaña la sección del golfista');

        const preview = new URLSearchParams(window.location.search).get('preview');
        if (preview === 'player') {
          result.dataset.status = 'passed';
          result.textContent = JSON.stringify({ passed: true, preview, checks }, null, 2);
          return;
        }

        AuthEngine.profile.account_role = 'coach';
        PlayerPortal.active = false;
        PlayerPortal.setPlayerNavigationVisible(false);
        document.body.classList.remove('player-portal-active');
        document.getElementById('player-portal-panel').classList.remove('active');
        document.getElementById('messages-panel').classList.add('active');
        document.getElementById('current-page-title').textContent = 'Mensajes con Golfistas';
        await PlayerPortal.renderCoachMessagesHub();
        await new Promise((resolve) => setTimeout(resolve, 30));
        const hubText = document.getElementById('messages-container').textContent;
        assert(hubText.includes('Mensajes con tus golfistas'), 'El entrenador dispone de un centro de conversaciones');
        assert(Boolean(document.querySelector('[data-coach-hub-message-id="local-player-real"]')), 'Una ficha vinculada permite abrir su conversación');
        assert(document.querySelector('.coach-message-player-card button[disabled]')?.textContent.includes('No disponible'), 'La demostración queda excluida de los mensajes');

        if (preview === 'coach') {
          result.dataset.status = 'passed';
          result.textContent = JSON.stringify({ passed: true, preview, checks }, null, 2);
          return;
        }

        result.dataset.status = 'passed';
        result.textContent = JSON.stringify({ passed: true, checks }, null, 2);
      } catch (error) {
        result.dataset.status = 'failed';
        result.textContent = JSON.stringify({ passed: false, checks, error: error.message }, null, 2);
      }
    })();
  </script>
</body>
</html>
