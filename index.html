<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GolfCoach Pro • Tu Mentor Integral de Golf</title>

  <link rel="canonical" href="https://adanbrilzgolf.com.ar/">

  <!-- Mobile PWA & Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GolfCoach">
  <meta name="theme-color" content="#061c11">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

<body class="auth-resolving workspace-locked">

  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

  <div class="auth-resolving-screen" id="auth-resolving-screen" role="status" aria-live="polite">
    <div class="brand-badge" aria-hidden="true">⛳</div>
    <div>
      <strong>GolfCoach</strong>
      <span>Preparando un acceso seguro…</span>
    </div>
  </div>

  <div class="app-container">
    
    <!-- Sidebar Navigation (Desktop / Tablet) -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-badge" aria-hidden="true">⛳</div>
        <div class="brand-info">
          <h2>GolfCoach</h2>
          <span>Mentoría 360° SotaPar</span>
        </div>
      </div>

      <nav class="nav-menu" aria-label="Navegación principal">
        <button class="nav-item active" type="button" data-view="dashboard" aria-current="page">
          <span class="nav-icon">🏠</span>
          <span>Inicio</span>
        </button>
        <button class="nav-item" type="button" data-view="players">
          <span class="nav-icon">👥</span>
          <span>Golfistas</span>
        </button>
        <button class="nav-item" type="button" data-view="messages">
          <span class="nav-icon">💬</span>
          <span>Mensajes con Golfistas</span>
        </button>
        <button class="nav-item" type="button" data-view="assessment">
          <span class="nav-icon">📋</span>
          <span>Diagnóstico 360°</span>
          <span class="badge-count">Test</span>
        </button>
        <button class="nav-item" type="button" data-view="drills">
          <span class="nav-icon">🎯</span>
          <span>Entrenamiento & Drills</span>
        </button>
        <button class="nav-item" type="button" data-view="mental">
          <span class="nav-icon">🧠</span>
          <span>Juego Mental & Rutina</span>
        </button>
        <button class="nav-item" type="button" data-view="tactics">
          <span class="nav-icon">⛳</span>
          <span>Caddy & Estrategia</span>
        </button>
        <button class="nav-item" type="button" data-view="rounds">
          <span class="nav-icon">📊</span>
          <span>Scorecard & Rondas</span>
        </button>
        <button class="nav-item" type="button" data-view="mentor">
          <span class="nav-icon">💬</span>
          <span>Mentoría & Metas</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="player-context-label">Golfista seleccionado</span>
        <button class="player-mini-card" type="button" onclick="App.navigateTo('players')" title="Cambiar golfista seleccionado" aria-label="Cambiar golfista seleccionado">
          <span class="player-avatar" id="sidebar-player-avatar" aria-hidden="true">—</span>
          <span class="player-mini-info">
            <span class="player-mini-name" id="sidebar-player-name">Sin golfista</span>
            <span class="player-mini-meta" id="sidebar-player-hcp">HCP — · Meta —</span>
          </span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content" tabindex="-1">
      
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" id="mobile-drawer-toggle-btn" type="button" aria-label="Abrir menú" aria-controls="mobile-drawer-overlay" aria-expanded="false" onclick="App.toggleMobileDrawer()">☰</button>
          <h1 class="page-title" id="current-page-title">Dashboard 360°</h1>
          <span class="sr-only" id="route-announcer" role="status" aria-live="polite" aria-atomic="true"></span>
          <button class="demo-mode-indicator" id="demo-mode-indicator" type="button" hidden onclick="App.openDemoModeInfo()" title="Ver información del modo demo" aria-label="Modo demo activo. Ver información.">
            <span aria-hidden="true">🧪</span>
            <span>Modo demo</span>
          </button>
        </div>

        <button class="mobile-topbar-actions-btn" id="mobile-topbar-actions-btn" type="button" aria-label="Abrir acciones" aria-controls="topbar-actions" aria-expanded="false" onclick="App.toggleMobileTopbarActions()">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="5" r="1.75"></circle>
            <circle cx="12" cy="12" r="1.75"></circle>
            <circle cx="12" cy="19" r="1.75"></circle>
          </svg>
        </button>

        <div class="topbar-actions" id="topbar-actions">
          <button class="btn btn-secondary btn-sm pwa-install-button" id="install-app-btn" type="button" hidden onclick="App.closeMobileTopbarActions(); PWAEngine.promptInstall()" title="Instalar GolfCoach">
            <span class="topbar-action-icon" data-icon="download" aria-hidden="true"></span>
            <span class="topbar-action-label">Instalar</span>
          </button>
          <button class="btn-icon" id="auth-access-btn" type="button" onclick="App.closeMobileTopbarActions(); AuthEngine.openAccessModal()" title="Acceder por email" aria-label="Acceder por email">
            <span class="topbar-action-icon" aria-hidden="true">✉️</span>
            <span class="topbar-action-label">Cuenta</span>
          </button>
          <button class="btn-icon" id="cloud-sync-btn" type="button" hidden onclick="App.closeMobileTopbarActions(); CloudSync.openSyncModal()" title="Respaldo y sincronización cloud" aria-label="Respaldo y sincronización cloud">
            <span class="topbar-action-icon" aria-hidden="true">☁️</span>
            <span class="topbar-action-label">Respaldo cloud</span>
          </button>
          <button class="btn-icon" id="theme-toggle-btn" type="button" onclick="App.toggleTheme(); App.closeMobileTopbarActions()" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro">
            <span class="topbar-action-icon" aria-hidden="true">☀️</span>
            <span class="topbar-action-label">Cambiar tema</span>
          </button>
          <button class="btn-icon" id="profile-settings-btn" type="button" onclick="App.closeMobileTopbarActions(); App.openProfileModal()" title="Editar golfista seleccionado" aria-label="Editar golfista seleccionado">
            <span class="topbar-action-icon" aria-hidden="true">⚙️</span>
            <span class="topbar-action-label">Editar golfista</span>
          </button>
          <button class="btn btn-primary btn-sm" type="button" id="topbar-new-round-btn" onclick="App.closeMobileTopbarActions(); RoundsEngine.openNewRoundModal()">
            ➕ Ronda
          </button>
        </div>
      </header>

      <!-- Persistent coach workspace context: account identity vs selected golfer. -->
      <section class="workspace-context-bar" id="workspace-context-bar" aria-label="Contexto de trabajo">
        <button class="workspace-context-control workspace-account-context" id="workspace-account-context" onclick="AuthEngine.openAccessModal()" type="button">
          <span class="workspace-context-icon" aria-hidden="true">👤</span>
          <span class="workspace-context-copy">
            <span class="workspace-context-label" id="workspace-account-label">Entrenador</span>
            <strong id="workspace-coach-name">Espacio bloqueado</strong>
          </span>
        </button>
        <span class="workspace-context-divider" aria-hidden="true"></span>
        <button class="workspace-context-control workspace-player-context" id="workspace-player-context" onclick="App.navigateTo('players')" type="button">
          <span class="workspace-context-icon" aria-hidden="true">🏌️</span>
          <span class="workspace-context-copy">
            <span class="workspace-context-label">Viendo a</span>
            <strong id="workspace-player-name">Sin golfista</strong>
          </span>
          <span class="workspace-player-handicap" id="workspace-player-hcp">HCP —</span>
          <span class="workspace-context-change">Cambiar</span>
        </button>
      </section>

      <!-- 1. Dashboard View Panel -->
      <section class="view-panel active" id="dashboard-panel" aria-hidden="false">
        <div id="dashboard-container"></div>
      </section>

      <!-- Private player experience. Activated only for authenticated golfers. -->
      <section class="view-panel" id="player-portal-panel" aria-live="polite" aria-hidden="true">
        <div id="player-portal-container"></div>
      </section>

      <!-- 2. Players & Database View Panel -->
      <section class="view-panel" id="players-panel" aria-hidden="true">
        <div id="players-container"></div>
      </section>

      <!-- Coach-to-player private conversations hub. -->
      <section class="view-panel" id="messages-panel" aria-hidden="true">
        <div id="messages-container"></div>
      </section>

      <!-- 3. Assessment View Panel -->
      <section class="view-panel" id="assessment-panel" aria-hidden="true">
        <div id="assessment-container"></div>
      </section>

      <!-- 3. Drills View Panel -->
      <section class="view-panel" id="drills-panel" aria-hidden="true">
        <div id="drills-container"></div>
      </section>

      <!-- 4. Mental View Panel -->
      <section class="view-panel" id="mental-panel" aria-hidden="true">
        <div id="mental-container"></div>
      </section>

      <!-- 5. Tactics View Panel -->
      <section class="view-panel" id="tactics-panel" aria-hidden="true">
        <div id="tactics-container"></div>
      </section>

      <!-- 6. Rounds View Panel -->
      <section class="view-panel" id="rounds-panel" aria-hidden="true">
        <div id="rounds-container"></div>
      </section>

      <!-- 7. Mentor View Panel -->
      <section class="view-panel" id="mentor-panel" aria-hidden="true">
        <div id="mentor-container"></div>
      </section>

    </main>

    <!-- Mobile Bottom Navigation Bar (Thumb Reachable) -->
    <nav class="bottom-nav-bar coach-bottom-nav" id="mobile-bottom-nav" aria-label="Navegación del entrenador">
      <button class="bottom-nav-item active" type="button" data-view="dashboard" onclick="App.navigateTo('dashboard')" aria-current="page">
        <span class="bottom-nav-icon">🏠</span>
        <span class="bottom-nav-label">Inicio</span>
      </button>
      <button class="bottom-nav-item" type="button" data-view="players" onclick="App.navigateTo('players')">
        <span class="bottom-nav-icon">👥</span>
        <span class="bottom-nav-label">Golfistas</span>
      </button>
      <button class="bottom-nav-item" type="button" data-view="drills" onclick="App.navigateTo('drills')">

      <button class="bottom-nav-item" id="mobile-more-btn" type="button" onclick="App.toggleMobileDrawer()" aria-label="Abrir más secciones" aria-controls="mobile-drawer-overlay" aria-expanded="false">
        <span class="bottom-nav-icon">☰</span>
        <span class="bottom-nav-label">Más</span>
      </button>
    </nav>

    <nav class="bottom-nav-bar player-bottom-nav" id="player-bottom-nav" aria-label="Navegación del golfista" hidden>

      <button class="bottom-nav-item" type="button" data-player-section="progress" onclick="PlayerPortal.navigateToSection('progress')">
        <span class="bottom-nav-icon">📈</span>
        <span class="bottom-nav-label">Progreso</span>
      </button>
      <button class="bottom-nav-item" type="button" data-player-section="messages" onclick="PlayerPortal.navigateToSection('messages')">
        <span class="bottom-nav-icon">💬</span>
        <span class="bottom-nav-label">Mensajes</span>
      </button>
    </nav>

  </div>

      <div class="sidebar-header">
        <div class="brand-badge" aria-hidden="true">⛳</div>
        <div class="brand-info">
          <h2 id="mobile-drawer-title">GolfCoach</h2>

      <nav class="nav-menu" style="padding-top: 0.5rem;" aria-label="Todas las secciones">
        <button class="nav-item" type="button" data-view="dashboard" onclick="App.navigateTo('dashboard'); App.closeMobileDrawer();">
          <span class="nav-icon">🏠</span>
          <span>Dashboard 360°</span>
        </button>
        <button class="nav-item" type="button" data-view="players" onclick="App.navigateTo('players'); App.closeMobileDrawer();">
          <span class="nav-icon">👥</span>
          <span>Golfistas</span>
        </button>
        <button class="nav-item" type="button" data-view="messages" onclick="App.navigateTo('messages'); App.closeMobileDrawer();">
          <span class="nav-icon">💬</span>
          <span>Mensajes con Golfistas</span>

        <button class="nav-item" type="button" data-view="assessment" onclick="App.navigateTo('assessment'); App.closeMobileDrawer();">
          <span class="nav-icon">📋</span>
          <span>Diagnóstico 360°</span>
        </button>
        <button class="nav-item" type="button" data-view="drills" onclick="App.navigateTo('drills'); App.closeMobileDrawer();">
          <span class="nav-icon">🎯</span>
          <span>Entrenamiento & Drills</span>
        </button>
        <button class="nav-item" type="button" data-view="mental" onclick="App.navigateTo('mental'); App.closeMobileDrawer();">
          <span class="nav-icon">🧠</span>

        <button class="nav-item" type="button" data-view="tactics" onclick="App.navigateTo('tactics'); App.closeMobileDrawer();">

        <button class="nav-item" type="button" data-view="rounds" onclick="App.navigateTo('rounds'); App.closeMobileDrawer();">

        </button>
        <button class="nav-item" type="button" data-view="mentor" onclick="App.navigateTo('mentor'); App.closeMobileDrawer();">

      <div class="sidebar-footer">
        <span class="player-context-label">Golfista seleccionado</span>
        <button class="player-mini-card" type="button" onclick="App.navigateTo('players'); App.closeMobileDrawer();" title="Cambiar golfista seleccionado" aria-label="Cambiar golfista seleccionado">
          <span class="player-avatar" id="drawer-player-avatar" aria-hidden="true">A</span>
          <span class="player-mini-info">
            <span class="player-mini-name" id="drawer-player-name">Sin golfista</span>
            <span class="player-mini-meta" id="drawer-player-hcp">HCP — · Cambiar</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Global Modal Overlay (Bottom Sheet on Mobile) -->
  <div class="modal-overlay" id="global-modal" aria-hidden="true" onclick="if(event.target===this) App.requestModalClose()">
    <div class="modal-box" id="global-modal-content" role="dialog" aria-modal="true" aria-label="Ventana de GolfCoach" tabindex="-1">
      <!-- Dynamic Content Populated by Engine Classes -->
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" aria-label="Notificaciones"></div>
